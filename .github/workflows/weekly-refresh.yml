name: Weekly Territory Cards Refresh

on:
  schedule:
    # Daily at 13:00 UTC = 5:00 AM PST (6:00 AM PDT). Daily cadence ensures
    # closed-month archives capture within ~24 hours of rollover and that
    # mid-week glances see fresh data.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout weekly-territory-cards
        uses: actions/checkout@v6

      - name: Checkout osr-enrollmentdash (for snapshot data)
        uses: actions/checkout@v6
        with:
          repository: KevinVillegasDev/osr-enrollmentdash
          path: _dashboard
          # Only need the snapshot JSON — shallow clone is fine.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate weekly-data.js
        run: |
          python automation/generate_weekly_data.py \
            --dashboard-root _dashboard \
            --historical data/historical-totals.json \
            --output data/weekly-data.js

      - name: Check for changes
        id: changes
        run: |
          # git status --porcelain handles missing paths, modifications, and
          # untracked new files in one go without erroring out.
          dirty="$(git status --porcelain data/weekly-data.js data/historical-totals.json data/monthly-archives 2>/dev/null || true)"
          if [ -n "$dirty" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$dirty"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/weekly-data.js data/historical-totals.json
          if [ -d data/monthly-archives ]; then
            git add data/monthly-archives
          fi
          git commit -m "Weekly refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Retry-on-race: if someone pushed code changes between our checkout
          # and our push, rebase on top and try again. Data files only — won't
          # collide with code changes.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — pulling --rebase and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Push still rejected after 5 attempts"
          exit 1
